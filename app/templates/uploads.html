{% extends "base.html" %}
{% block content %}
<h1>Upload center — Level {{level}}</h1>
{% if flag %}<p class="flag">{{flag}}</p>{% endif %}
{% if name %}<p>Stored as: <a href="/static/uploads/{{name}}">{{name}}</a></p>{% endif %}
<form method="post" action="/upload" enctype="multipart/form-data" class="form">
  <input type="hidden" name="level" value="{{level}}">
  <input type="file" name="file" required>
  <button>Upload</button>
</form>
<h2>Uploaded files</h2>
<ul>
{% for f in files %}
  <li><a href="/static/uploads/{{f}}">{{f}}</a></li>
{% endfor %}
</ul>
<p><a href="/category/upload">Back</a></p>
{% endblock %}
