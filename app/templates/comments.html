{% extends "base.html" %}
{% block content %}
<h1>Comments — Level {{level}}</h1>
<form method="post" action="/comments" class="form">
  <input type="hidden" name="level" value="{{level}}">
  <input name="author" placeholder="Author" required>
  <textarea name="body" placeholder="Comment" required></textarea>
  <button>Post</button>
</form>
{% for row in rows %}
<article class="comment">
  <b>{{row["author"]}}</b>
  {% if level == 1 %}
    <div>{{row["body"]|safe}}</div>
  {% elif level == 2 %}
    <div>{{ row["body"]|replace("<script>","")|replace("<SCRIPT>","")|safe }}</div>
  {% else %}
    <div title="{{row['body']|safe}}">hover to view comment</div>
  {% endif %}
</article>
{% endfor %}
{% endblock %}
