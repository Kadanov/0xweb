{% extends "base.html" %}
{% block content %}
<h1>Comments — Level {{level}}</h1>
<form method="post" action="/comments" class="form">
  <input type="hidden" name="level" value="{{level}}">
  <input name="author" placeholder="Author" required>
  <textarea name="body" placeholder="Comment" required></textarea>
  <button>Post</button>
</form>
{% for c in items %}
<article class="comment">
  <b>{{c.author}}</b>
  <div>{{ c.display|safe }}</div>
</article>
{% endfor %}
{% endblock %}
