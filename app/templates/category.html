{% extends "base.html" %}
{% block content %}
<p class="crumb"><a href="/">&larr; All categories</a></p>
<h1>{{ "0" if cat.num < 10 else "" }}{{cat.num}} · {{cat.name}}</h1>
<p class="objective"><b>Objective:</b> {{cat.objective}}</p>

<div class="level-list">
  {% for lv in cat.levels %}
  <div class="level">
    <div class="level-badge">Level {{lv.n}}</div>
    <div class="level-body">
      <p class="level-note">{{lv.note}}</p>
      <a class="btn" href="{{lv.entry}}">Open entry point</a>
      <code class="entry">{{lv.entry}}</code>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
